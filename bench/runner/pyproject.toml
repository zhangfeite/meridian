[project]
name = "meridian-bench"
version = "0.1.0"
description = "Deterministic, standalone runner for Meridian Bench"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Meridian contributors" }]
dependencies = []

[project.scripts]
bench = "meridian_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
