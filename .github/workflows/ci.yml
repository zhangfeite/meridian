name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Bench tests
        run: uv --directory bench/runner run pytest -q
      - name: Task schema + trap sensitivity
        run: uv --directory bench/runner run bench validate

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agent
        working-directory: agent
        run: npm ci
      - name: Typecheck
        working-directory: agent
        run: npx tsc -p tsconfig.json --noEmit
      - name: Agent tests
        working-directory: agent
        run: npm test
      - name: Kernel boundary
        run: node adapter/scripts/check-dsh-boundary.mjs

  cli-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agent deps (workspace dependency)
        working-directory: agent
        run: npm ci
      - name: CLI install + tests
        working-directory: cli
        run: npm ci && npm test
      - name: Web install + tests
        working-directory: web
        run: npm ci && npm test
